<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Переход к резюме</title>
<script>
  const person = new URLSearchParams(location.search).get("person");
  location.replace(person === null ? "index.html" : `index.html?person=${encodeURIComponent(person)}`);
</script>
</head>
<body></body>
</html>
